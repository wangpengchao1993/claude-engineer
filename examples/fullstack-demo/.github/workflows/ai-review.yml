# AI-Assisted Code Review / AI 辅助代码审查
# Runs tests, linting, and Claude Code review on every pull request.
# 在每个 Pull Request 上运行测试、代码检查和 Claude Code 审查。

name: AI Code Review / AI 代码审查

on:
  pull_request:
    branches: [main]
    # Trigger on all PR types / 在所有 PR 类型上触发
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR / 取消同一 PR 的进行中运行
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Test & Lint / 测试与代码检查 ──────────────────────────────
  test:
    name: Tests & Lint / 测试与代码检查
    runs-on: ubuntu-latest
    steps:
      # Checkout code / 检出代码
      - uses: actions/checkout@v4

      # Set up Node.js / 设置 Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install dependencies / 安装依赖
      - name: Install backend dependencies / 安装后端依赖
        run: cd backend && npm ci

      - name: Install frontend dependencies / 安装前端依赖
        run: cd frontend && npm ci

      # Run backend tests / 运行后端测试
      - name: Backend tests / 后端测试
        run: cd backend && npm test -- --ci --coverage
        env:
          NODE_ENV: test
          DB_PATH: ":memory:"

      # Run frontend tests / 运行前端测试
      - name: Frontend tests / 前端测试
        run: cd frontend && npm test -- --run --coverage

      # Run linter across project / 在整个项目上运行代码检查
      - name: Lint / 代码检查
        run: npm run lint

      # Upload coverage reports / 上传覆盖率报告
      - name: Upload coverage / 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/coverage/
            frontend/coverage/

  # ── AI Review / AI 审查 ──────────────────────────────────────
  ai-review:
    name: Claude Code Review / Claude Code 审查
    runs-on: ubuntu-latest
    needs: test  # Only review if tests pass / 仅在测试通过后审查
    permissions:
      contents: read
      pull-requests: write  # Required to post comments / 需要发布评论权限

    steps:
      # Checkout code / 检出代码
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff analysis / 完整历史以分析差异

      # Run Claude Code review / 运行 Claude Code 审查
      - name: AI Review / AI 审查
        uses: anthropics/claude-code-action@v1
        with:
          # Review prompt -- tells Claude what to focus on
          # 审查提示 -- 告诉 Claude 关注什么
          prompt: |
            Review this pull request. Focus on:
            1. Security issues (SQL injection, XSS, auth bypasses)
            2. Performance problems (N+1 queries, missing indexes, large payloads)
            3. Error handling gaps (unhandled promises, missing validation)
            4. API contract consistency (response format, status codes)
            5. Test coverage for changed code paths

            Use the project's CLAUDE.md for code conventions and architecture context.
            Post specific, actionable feedback with code suggestions where applicable.
            Be concise -- only comment on things that need to change.

          # Claude Code will use CLAUDE.md automatically
          # Claude Code 会自动使用 CLAUDE.md
          use_claude_md: true

          # Only review changed files / 仅审查已更改的文件
          diff_only: true

        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Post summary comment / 发布摘要评论
      - name: Post review summary / 发布审查摘要
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Check if we already posted a summary / 检查是否已发布摘要
            const existing = comments.find(c =>
              c.body.includes('<!-- ai-review-summary -->')
            );

            const body = [
              '<!-- ai-review-summary -->',
              '## AI Review Complete / AI 审查完成',
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| Tests / 测试 | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |`,
              `| AI Review / AI 审查 | ✅ Complete / 完成 |`,
              '',
              '> Review generated by Claude Code Action.',
              '> 审查由 Claude Code Action 生成。',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
