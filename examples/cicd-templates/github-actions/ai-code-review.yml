# =============================================================================
# AI Code Review with Claude / 使用 Claude 进行 AI 代码审查
# =============================================================================
# This workflow automatically reviews pull requests using Claude.
# 此工作流使用 Claude 自动审查拉取请求。
#
# Prerequisites / 前提条件:
#   - Set ANTHROPIC_API_KEY as a repository secret
#     将 ANTHROPIC_API_KEY 设置为仓库密钥
#   - Ensure the workflow has write permissions for pull-requests
#     确保工作流对 pull-requests 有写入权限
# =============================================================================

name: AI Code Review / AI 代码审查

# Trigger on pull request events / 在拉取请求事件时触发
on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Only review code files, skip docs and config
    # 仅审查代码文件，跳过文档和配置
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.jsx'
      - '**.tsx'
      - '**.go'
      - '**.rs'
      - '**.java'
      - '**.rb'
      - '**.php'
      - '**.c'
      - '**.cpp'
      - '**.h'

# Permissions required for posting PR comments
# 发布 PR 评论所需的权限
permissions:
  contents: read
  pull-requests: write

# Cancel in-progress runs for the same PR to save costs
# 取消同一 PR 正在进行的运行以节省成本
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-code-review:
    # Skip draft PRs to save API costs / 跳过草稿 PR 以节省 API 成本
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Claude Code Review / Claude 代码审查

    steps:
      # Step 1: Checkout the repository / 步骤 1：检出仓库
      - name: Checkout repository / 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate diffs / 完整历史以获取准确差异

      # Step 2: Run Claude code review via official action
      # 步骤 2：通过官方 action 运行 Claude 代码审查
      - name: Run Claude Code Review / 运行 Claude 代码审查
        uses: anthropics/claude-code-action@v1
        with:
          # The prompt sent to Claude for review
          # 发送给 Claude 的审查提示
          prompt: |
            Review this pull request and provide feedback. Focus on:
            请审查此拉取请求并提供反馈。重点关注：

            1. **Bugs & Logic Errors / 错误和逻辑错误**
               - Off-by-one errors, null pointer risks, race conditions
               - 越界错误、空指针风险、竞争条件
            2. **Security Issues / 安全问题**
               - Injection vulnerabilities, hardcoded secrets, missing input validation
               - 注入漏洞、硬编码密钥、缺少输入验证
            3. **Performance / 性能**
               - Unnecessary allocations, N+1 queries, missing indexes
               - 不必要的分配、N+1 查询、缺少索引
            4. **Code Quality / 代码质量**
               - Naming, readability, DRY violations, missing error handling
               - 命名、可读性、DRY 违规、缺少错误处理
            5. **Test Coverage / 测试覆盖**
               - Are there tests for new functionality? Are edge cases covered?
               - 新功能是否有测试？边界情况是否覆盖？

            Provide your review as inline comments on specific lines where possible.
            If the code looks good, say so briefly.
            请尽可能在具体行上提供内联评论。如果代码没有问题，请简要说明。

          # Model selection: sonnet for cost-effective reviews
          # 模型选择：使用 sonnet 以获得性价比高的审查
          model: claude-sonnet-4-20250514

          # Maximum tokens for the response / 响应的最大令牌数
          max_tokens: 4096

          # API key from repository secrets / 来自仓库密钥的 API 密钥
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Use the default GITHUB_TOKEN for posting comments
          # 使用默认的 GITHUB_TOKEN 发布评论
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Post a summary comment on the PR
      # 步骤 3：在 PR 上发布摘要评论
      - name: Post Review Summary / 发布审查摘要
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // Post a footer comment indicating AI review was performed
            // 发布页脚评论，表明已执行 AI 审查
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## AI Code Review Complete / AI 代码审查完成',
                '',
                '> This review was generated by Claude. Please verify all suggestions before applying.',
                '> 此审查由 Claude 生成。请在应用前验证所有建议。',
                '',
                `Model / 模型: \`claude-sonnet-4-20250514\``,
                `Triggered by / 触发者: @${context.actor}`,
              ].join('\n')
            });
